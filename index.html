<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部会ポータル</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #0078d4, #004578);
            color: white;
            padding: 50px 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #0078d4;
            margin-bottom: 15px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        .button {
            display: inline-block;
            background: #0078d4;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
        }

        .button:hover {
            background: #005ea6;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #eaeaea;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>部会ポータルサイト</h1>
    <p>生成AIで作成したサンプル静的Webサイト</p>
</header>

<div class="container">

    <div class="card">
        <h2>📅 今後の予定</h2>
        <ul>
            <li>9/10 第1回 AI活用勉強会</li>
            <li>9/24 静的Webサイト作成ハンズオン</li>
            <li>10/8 GitHub Pages公開会</li>
        </ul>
    </div>

    <div class="card">
        <h2>📢 お知らせ</h2>
        <p>
            このサイトはM365 Copilotで作成したHTMLのサンプルです。
            GitHub Pagesへ公開することで誰でも閲覧できます。
        </p>
    </div>

    <div class="card">
        <h2>📚 学習コンテンツ</h2>
        <ul>
            <li>HTML/CSS入門</li>
            <li>GitHub活用方法</li>
            <li>生成AIによる開発体験</li>
        </ul>
    </div>

    <div class="card">
        <h2>🔗 関連リンク</h2>
        <a class="button" href         GitHubを開く
        </a>
    </div>

</div>

<footer>
    © 2026 部会ポータル
</footer>

</body>
</html>
