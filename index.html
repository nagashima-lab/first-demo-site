<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Microsoft 365 活用部会ポータル</title>

    css/style.css

    <script src.jsdelivr.net/npm/chart.jsscript>
</head>

<body>

    <button id="themeToggle" class="theme-btn">
        🌙
    </button>

    <header class="hero">

        <div class="hero-content">

            <div class="hero-left">

                <h1>🚀 Microsoft 365 活用部会</h1>

                <p>
                    AIで学び、AIで作り、AIで共有する
                </p>

                <div class="hero-buttons">

                    #schedule
                        📅 部会予定
                    </a>

                    #learning
                        📚 資格学習
                    </a>

                    #links
                        🤖 AI活用
                    </a>

                </div>

            </div>

            <div class="hero-right">

                <div class="next-event">

                    <div class="event-title">
                        次回部会
                    </div>

                    <div id="nextDays" class="event-count">
                        D-0
                    </div>

                    <div id="nextDate" class="event-date">
                        2026/09/10
                    </div>

                </div>

            </div>

        </div>

    </header>

    <!-- サマリー -->

    <section class="summary" id="summary">
    </section>

    <!-- 予定 -->

    <section class="card fade-in" id="schedule">

        <h2>📅 今後の予定</h2>

        <div id="eventList"></div>

    </section>

    <!-- 資格 -->

    <section class="card fade-in" id="learning">

        <h2>📚 資格学習ダッシュボード</h2>

        <div id="certificationList">
        </div>

    </section>

    <!-- AIリンク -->

    <section class="card fade-in" id="links">

        <h2>🤖 AI活用リンク集</h2>

        <div id="linkList"></div>

    </section>

    <!-- 今日のおすすめ -->

    <section class="card fade-in">

        <h2>💡 Today's Topic</h2>

        <div class="topic-card">

            <h3>
                Copilotで業務手順書を作成する
            </h3>

            <p>
                Copilotを使った業務効率化の実践例を紹介します。
            </p>

        </div>

    </section>

    <!-- ヒートマップ -->

    <section class="card fade-in">

        <h2>🌱 学習ヒートマップ</h2>

        <div id="heatmap"></div>

    </section>

    <!-- グラフ -->

    <section class="card fade-in">

        <h2>📈 学習時間推移</h2>

        <canvas id="studyChart"></canvas>

    </section>

    <!-- フッター -->

    <footer>

        <p>
            Microsoft 365 活用部会 Portal
        </p>

    </footer>

    js/data.jsscript>

    js/app.jsscript>

</body>

</html>
